<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critical assessment</title>
<style>
  /* Design read: decision memo for a technical reader. Calm editorial utility, system sans, one accent (emerald), one radius (10px). */
  :root {
    --bg: #fafafa; --surface: #ffffff; --sunk: #f4f4f5;
    --ink: #18181b; --ink-2: #3f3f46; --muted: #71717a; --line: #e4e4e7; --line-2: #d4d4d8;
    --accent: #047857; --accent-ink: #065f46; --accent-soft: #ecfdf5; --accent-line: #a7f3d0;
    --risk: #9f1239; --risk-soft: #fff1f2;
    --pip-off: #e4e4e7;
    --r: 10px;
    --shadow: 0 1px 2px rgb(24 24 27 / .04), 0 8px 24px -12px rgb(24 24 27 / .10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0c0e; --surface: #141417; --sunk: #1b1b1f;
      --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1aa; --line: #27272a; --line-2: #3f3f46;
      --accent: #34d399; --accent-ink: #6ee7b7; --accent-soft: #0b2a20; --accent-line: #14532d;
      --risk: #fda4af; --risk-soft: #2a1116; --pip-off: #2e2e33;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0c0e; --surface: #141417; --sunk: #1b1b1f;
    --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1aa; --line: #27272a; --line-2: #3f3f46;
    --accent: #34d399; --accent-ink: #6ee7b7; --accent-soft: #0b2a20; --accent-line: #14532d;
    --risk: #fda4af; --risk-soft: #2a1116; --pip-off: #2e2e33;
    --shadow: none; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-feature-settings: "tnum" 1;
  }
  main { max-width: 920px; margin: 0 auto; padding: 40px 24px 80px; }
  h1, h2, h3 { margin: 0; letter-spacing: -0.015em; }
  p { margin: 0; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .muted { color: var(--muted); }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .theme { background: none; border: 1px solid var(--line-2); border-radius: var(--r); padding: 4px 12px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  h1 { font-size: clamp(26px, 4vw, 34px); line-height: 1.15; font-weight: 650; margin-top: 14px; max-width: 26ch; }
  .question { color: var(--ink-2); margin-top: 8px; max-width: 65ch; }

  /* Layer 1: decision */
  .decision { margin-top: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .decision-body { padding: 28px 28px 24px; }
  .pick-label { font-size: 14px; color: var(--muted); }
  .pick { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
  .pick-name { font-size: clamp(30px, 5vw, 42px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: var(--r); background: var(--accent-soft); color: var(--accent-ink); border: 1px solid var(--accent-line); }
  .summary { margin-top: 12px; font-size: 17px; color: var(--ink-2); max-width: 68ch; }
  .conditions { margin: 14px 0 0; padding-left: 20px; color: var(--ink-2); }
  .first { margin-top: 20px; border-left: 3px solid var(--accent); padding: 4px 0 4px 16px; }
  .first strong { display: block; font-size: 14px; color: var(--accent-ink); }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); background: var(--sunk); }
  .fact { padding: 14px 20px 16px; }
  .fact + .fact { border-left: 1px solid var(--line); }
  .fact-k { font-size: 13px; color: var(--muted); }
  .fact-v { font-weight: 650; margin-top: 2px; }
  .fact-s { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }

  /* Watch-outs */
  .watch { margin-top: 20px; }
  .watch h2 { font-size: 15px; font-weight: 650; }
  .watch ul { list-style: none; margin: 8px 0 0; padding: 0; }
  .watch li { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
  .watch-k { font-size: 13.5px; color: var(--muted); padding-top: 1px; }
  .watch li details summary { list-style: none; cursor: pointer; }
  .watch li details summary::-webkit-details-marker { display: none; }
  .watch li details summary .more { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .watch li details p { margin-top: 6px; color: var(--ink-2); font-size: 15px; }
  .linkbtn { background: none; border: 0; padding: 8px 0 0; color: var(--accent-ink); font-size: 14px; font-weight: 600; cursor: pointer; }

  /* Sections */
  section { margin-top: 64px; }
  h2.big { font-size: 22px; font-weight: 650; }
  .lede { color: var(--muted); margin-top: 4px; font-size: 15px; max-width: 65ch; }

  /* Matrix */
  .matrix-wrap { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  table.matrix { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .matrix th, .matrix td { padding: 12px 14px; text-align: left; vertical-align: middle; }
  .matrix thead th { font-size: 14px; font-weight: 650; border-bottom: 1px solid var(--line); line-height: 1.3; }
  .matrix thead th .rec { display: block; font-size: 12px; font-weight: 600; color: var(--accent-ink); margin-top: 2px; }
  .matrix th.crit { width: 34%; font-weight: 500; font-size: 15px; }
  .matrix th.crit .w { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
  .matrix tbody tr + tr th, .matrix tbody tr + tr td { border-top: 1px solid var(--line); }
  .matrix .is-rec { background: var(--accent-soft); }
  .matrix tfoot td, .matrix tfoot th { border-top: 1px solid var(--line-2); font-weight: 650; }
  .total { font-size: 22px; letter-spacing: -0.02em; }
  .total small { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .total.lead { color: var(--accent-ink); }
  .cellbtn { display: inline-flex; align-items: center; gap: 10px; background: none; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin: -5px -7px; cursor: pointer; }
  .cellbtn:hover { border-color: var(--line-2); }
  .cellbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
  .pips { display: inline-flex; gap: 3px; }
  .pips i { width: 8px; height: 8px; border-radius: 2px; background: var(--pip-off); }
  .pips i.on { background: var(--ink-2); }
  .is-rec .pips i.on { background: var(--accent); }
  .num { font-size: 14px; color: var(--muted); min-width: 1ch; }
  .reason { padding: 14px 16px; border-top: 1px solid var(--line); background: var(--sunk); font-size: 15px; color: var(--ink-2); min-height: 52px; }
  .reason b { color: var(--ink); }

  /* Priorities */
  details.prio { border-top: 1px solid var(--line); }
  details.prio > summary { cursor: pointer; padding: 12px 16px; font-size: 14.5px; font-weight: 600; color: var(--accent-ink); }
  .sliders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; padding: 4px 16px 18px; }
  .slider label { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); }
  .slider input { width: 100%; accent-color: var(--accent); }
  .prio-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 16px 16px; font-size: 14px; color: var(--ink-2); }
  .reset { background: none; border: 1px solid var(--line-2); border-radius: var(--r); padding: 4px 12px; font-size: 13px; cursor: pointer; }

  /* For / against */
  .tabs { display: flex; gap: 4px; margin-top: 28px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 10px; font-size: 15px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .fa { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; margin-top: 18px; }
  .fa h3 { font-size: 14px; font-weight: 650; }
  .fa h3.for { color: var(--accent-ink); }
  .fa h3.against { color: var(--risk); }
  .fa ol { list-style: none; margin: 6px 0 0; padding: 0; }
  .fa li { border-top: 1px solid var(--line); }
  .fa li:first-child { border-top: 0; }
  .item > summary { list-style: none; cursor: pointer; padding: 10px 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
  .item > summary::-webkit-details-marker { display: none; }
  .item > summary::after { content: "+"; color: var(--muted); font-size: 18px; line-height: 1.2; }
  .item[open] > summary::after { content: "\2212"; }
  .item-body { padding: 0 0 12px; font-size: 14.5px; color: var(--ink-2); }
  .item-meta { margin-top: 6px; font-size: 13px; color: var(--muted); }

  /* Layer 3 */
  .council { margin-top: 18px; }
  .agree { display: flex; gap: 4px; margin-top: 14px; }
  .agree span { flex: 1; height: 6px; border-radius: 3px; background: var(--line-2); }
  .agree span.yes { background: var(--accent); }
  .member { border-top: 1px solid var(--line); }
  .member:last-child { border-bottom: 1px solid var(--line); }
  .member > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 170px 170px minmax(0, 1fr) 16px; gap: 16px; padding: 14px 0; align-items: baseline; }
  .member > summary::-webkit-details-marker { display: none; }
  .member > summary::after { content: "+"; color: var(--muted); }
  .member[open] > summary::after { content: "\2212"; }
  .m-name { font-weight: 600; }
  .m-pick { font-size: 14px; }
  .m-pick.yes { color: var(--accent-ink); font-weight: 600; }
  .m-point { color: var(--ink-2); font-size: 15px; }
  .m-body { padding: 0 0 18px; display: grid; gap: 10px; font-size: 14.5px; color: var(--ink-2); max-width: 70ch; }
  .m-body h4 { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .m-body ul { margin: 0; padding-left: 18px; }
  .m-body .flip { color: var(--ink); }

  .more-sec { margin-top: 28px; border-top: 1px solid var(--line); }
  .more-sec > details { border-bottom: 1px solid var(--line); }
  .more-sec > details > summary { cursor: pointer; padding: 14px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
  .more-sec > details > summary::-webkit-details-marker { display: none; }
  .more-sec > details > summary::after { content: "+"; color: var(--muted); font-weight: 400; }
  .more-sec > details[open] > summary::after { content: "\2212"; }
  .more-sec .sum-note { font-weight: 400; color: var(--muted); font-size: 14.5px; margin-left: auto; text-align: right; }
  .bg { padding: 0 0 20px; display: grid; gap: 14px; font-size: 15px; color: var(--ink-2); max-width: 70ch; }
  .bg h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .bg ul { margin: 4px 0 0; padding-left: 18px; }
  .bg a { color: var(--accent-ink); }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    details[open] > :not(summary) { animation: in .25s cubic-bezier(.16, 1, .3, 1); }
    @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
  }

  @media (max-width: 760px) {
    main { padding: 28px 16px 64px; }
    .decision-body { padding: 22px 18px 18px; }
    .facts { grid-template-columns: 1fr; }
    .fact + .fact { border-left: 0; border-top: 1px solid var(--line); }
    .watch li { grid-template-columns: 1fr; gap: 2px; }
    .matrix th, .matrix td { padding: 10px 8px; }
    .matrix th.crit { width: 32%; font-size: 14px; }
    .matrix thead th { font-size: 13px; }
    .cellbtn { flex-direction: column; align-items: flex-start; gap: 4px; }
    .pips i { width: 6px; height: 6px; }
    .total { font-size: 18px; }
    .sliders, .fa { grid-template-columns: 1fr; }
    .fa { gap: 20px; }
    .member > summary { grid-template-columns: minmax(0, 1fr) auto 16px; gap: 4px 12px; }
    .m-point { grid-column: 1 / -1; grid-row: 2; }
  }

  @media print {
    .theme, .tabs, details.prio, .linkbtn { display: none !important; }
    details > :not(summary) { display: block !important; }
    .decision { box-shadow: none; }
  }
</style>
</head>
<body>
<main id="report"></main>
<script id="data" type="application/json">__RESULT_JSON__</script>
<script>
(() => {
  const R = JSON.parse(document.getElementById('data').textContent);
  const main = document.getElementById('report');
  const brief = R.brief || {};
  const options = brief.options || [];
  const criteria = brief.criteria || [];
  const scores = R.scores || [];
  const names = Object.fromEntries(options.map(o => [o.id, o.name]));
  const CATALOG = R.role_catalog || {};
  const titleCase = s => String(s || '').split(/[-_\s]+/).map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(' ');
  const roleName = id => (CATALOG[id] && CATALOG[id].name ? String(CATALOG[id].name).replace(/^The\s+/, '') : titleCase(id));

  /* Everything from the data goes in as text, never as markup. */
  const el = (tag, opts = {}, ...kids) => {
    const e = document.createElement(tag);
    if (opts.cls) e.className = opts.cls;
    if (opts.text != null) e.textContent = String(opts.text);
    if (opts.attrs) for (const [k, v] of Object.entries(opts.attrs)) e.setAttribute(k, v);
    for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(typeof k === 'string' ? document.createTextNode(k) : k);
    return e;
  };
  const list = x => (Array.isArray(x) ? x : x == null ? [] : [x]).map(String);
  const joinAnd = xs => xs.length <= 1 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];
  const URL_RE = /\bhttps?:\/\/[^\s<>"')\]]+/g;
  const linkify = s => {
    const f = document.createDocumentFragment(); const str = String(s || ''); let last = 0;
    for (const m of str.matchAll(URL_RE)) {
      f.append(str.slice(last, m.index));
      let label = m[0]; try { const u = new URL(m[0]); label = u.hostname.replace(/^www\./, ''); } catch {}
      f.append(el('a', { text: label, attrs: { href: m[0], target: '_blank', rel: 'noopener noreferrer', title: m[0] } }));
      last = m.index + m[0].length;
    }
    f.append(str.slice(last)); return f;
  };

  /* Scoring: mirrors scripts/scoring.py */
  const TOL = 1e-6;
  const normalize = w => { const t = Object.values(w).reduce((a, b) => a + b, 0); return Object.fromEntries(Object.entries(w).map(([k, v]) => [k, t > 0 ? v / t : 0])); };
  const cell = (o, c) => scores.find(x => x.option === o && x.criterion === c) || {};
  const totalsFor = w => { const n = normalize(w); const t = {}; for (const o of options) t[o.id] = criteria.reduce((s, c) => s + n[c.id] * (cell(o.id, c.id).score || 0), 0); return t; };
  const winnersOf = t => { const v = Object.values(t); if (!v.length) return []; const b = Math.max(...v); return Object.keys(t).filter(k => Math.abs(t[k] - b) < TOL).sort(); };
  const flipsFor = (w, delta = 0.1) => {
    const base = winnersOf(totalsFor(w)).join('|'); const n = normalize(w); const out = [];
    for (const c of criteria) for (const s of [-delta, delta]) {
      const sh = Object.fromEntries(Object.entries(n).map(([k, v]) => [k, Math.max(v + (k === c.id ? s : 0), 0)]));
      if (Object.values(sh).reduce((a, b) => a + b, 0) === 0) continue;
      const now = winnersOf(totalsFor(sh)); if (now.join('|') !== base) out.push({ c: c.id, s, now });
    }
    return out;
  };
  const initial = normalize(Object.fromEntries(criteria.map(c => [c.id, Number(c.weight) || 0])));
  const weights = { ...initial };
  const pct = v => Math.round(v * 100) + '%';
  const critName = id => (criteria.find(c => c.id === id) || {}).name || id;

  /* Which option each council member backed: the structured `pick`, else the first option named in its position. */
  const pickOf = r => {
    if (r.pick && names[r.pick]) return r.pick;
    const pos = String(r.position || '').toLowerCase(); let best = null, at = Infinity;
    for (const o of options) { const i = pos.indexOf(String(o.name).toLowerCase()); if (i >= 0 && i < at) { at = i; best = o.id; } }
    return best;
  };

  const decision = (R.verdict || {}).decision;
  // Single mode: a go backs the idea (A), a no-go backs the status quo (B), so the table and council can show agreement.
  const recId = names[decision] ? decision
    : brief.mode === 'single' && names.A && names.B ? (decision === 'no-go' ? 'B' : ['go', 'conditional-go'].includes(decision) ? 'A' : null)
    : null;
  const singleView = { 'go': 'Go', 'no-go': 'No-go', 'conditional-go': 'Go, with conditions', 'hybrid': 'A hybrid of the options' }[decision];

  /* ---------- Header ---------- */
  document.title = R.title || 'Critical assessment';
  const toggle = el('button', { cls: 'theme', attrs: { type: 'button' } });
  const theme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  try { const t = localStorage.getItem('ca-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  const setToggle = () => { toggle.textContent = theme() === 'dark' ? 'Light' : 'Dark'; toggle.setAttribute('aria-label', 'Switch to ' + toggle.textContent.toLowerCase() + ' theme'); };
  setToggle();
  toggle.addEventListener('click', () => { const n = theme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('ca-theme', n); } catch {} setToggle(); });
  main.append(el('header', {},
    el('div', { cls: 'top' }, el('span', { cls: 'eyebrow', text: 'Critical assessment' }), toggle),
    el('h1', { text: R.title || brief.question || 'Critical assessment' }),
    brief.question && R.title ? el('p', { cls: 'question', text: brief.question }) : null));

  /* ---------- Layer 1: the decision ---------- */
  const totals0 = totalsFor(initial);
  const ranked = Object.entries(totals0).sort((a, b) => b[1] - a[1]);
  const flips0 = flipsFor(initial);
  const reports = R.reports || [];
  const backers = recId ? reports.filter(r => pickOf(r) === recId) : [];

  const body = el('div', { cls: 'decision-body' },
    el('p', { cls: 'pick-label', text: brief.mode === 'single' ? 'Recommendation' : 'Go with' }),
    el('div', { cls: 'pick' }, el('span', { cls: 'pick-name', text: singleView || (recId ? names[recId] : decision || '') })),
    el('p', { cls: 'summary', text: (R.verdict || {}).summary || '' }));
  const conds = list((R.verdict || {}).conditions);
  if (conds.length) body.append(el('ul', { cls: 'conditions' }, conds.map(c => el('li', { text: c }))));
  if (R.first_step) body.append(el('div', { cls: 'first' }, el('strong', { text: 'First step' }), el('span', { text: R.first_step })));

  const conf = { high: 'High', medium: 'Medium', low: 'Low' }[R.confidence] || 'Unknown';
  const confSub = { high: 'The facts that decide this were checked.', medium: 'Rests on at least one assumption that is still open.', low: 'Hinges on facts nobody could check.' }[R.confidence] || '';
  const leader = ranked[0] ? ranked[0][0] : null;
  const gap = ranked.length > 1 ? ranked[0][1] - ranked[1][1] : 0;
  let scoreV, scoreS;
  if (leader && leader === recId) {
    scoreV = `Highest score, ${ranked[0][1].toFixed(1)} of 5`;
    scoreS = flips0.length ? `Ahead by ${gap.toFixed(1)}, but a small change in priorities changes the leader.` : `Ahead by ${gap.toFixed(1)}, and still ahead if any priority moves 10 points.`;
  } else if (leader) {
    scoreV = `${names[leader]} scores highest`;
    scoreS = recId ? 'The recommendation goes against the scores. The summary says why.'
      : 'The recommendation combines options. The summary says how.';
  }
  const facts = el('div', { cls: 'facts' },
    el('div', { cls: 'fact' }, el('div', { cls: 'fact-k', text: 'Confidence' }), el('div', { cls: 'fact-v', text: conf }), el('div', { cls: 'fact-s', text: confSub })),
    scoreV ? el('div', { cls: 'fact' }, el('div', { cls: 'fact-k', text: 'Scores' }), el('div', { cls: 'fact-v', text: scoreV }), el('div', { cls: 'fact-s', text: scoreS })) : null,
    reports.length && recId ? el('div', { cls: 'fact' }, el('div', { cls: 'fact-k', text: 'Council' }),
      el('div', { cls: 'fact-v', text: `${backers.length} of ${reports.length} chose ${names[recId]}` }),
      el('div', { cls: 'fact-s', text: 'Each member worked alone, from a different angle.' })) : null);
  main.append(el('div', { cls: 'decision', attrs: { role: 'region', 'aria-label': 'Recommendation' } }, body, facts));

  /* What could make this wrong: dissent, blind spots, unknowns in one list. */
  const risks = [];
  if (R.dissent && R.dissent.position) risks.push({ k: `Strongest disagreement, from the ${roleName(R.dissent.role)}`, v: R.dissent.position, more: R.dissent.why_rejected ? 'Why it was not followed: ' + R.dissent.why_rejected : null });
  list(R.blind_spots).forEach(b => risks.push({ k: 'Nobody on the council raised this', v: b }));
  list(R.unknowns).forEach(u => risks.push({ k: 'Still unknown', v: u }));
  if (risks.length) {
    const ul = el('ul');
    const row = r => el('li', {}, el('span', { cls: 'watch-k', text: r.k }),
      r.more ? el('details', {}, el('summary', {}, r.v + ' ', el('span', { cls: 'more', text: 'Why not followed' })), el('p', { text: r.more })) : el('span', { text: r.v }));
    const SHOW = 3;
    risks.slice(0, SHOW).forEach(r => ul.append(row(r)));
    const w = el('div', { cls: 'watch' }, el('h2', { text: 'What could make this wrong' }), ul);
    if (risks.length > SHOW) {
      const b = el('button', { cls: 'linkbtn', text: `Show ${risks.length - SHOW} more`, attrs: { type: 'button' } });
      b.addEventListener('click', () => { risks.slice(SHOW).forEach(r => ul.append(row(r))); b.remove(); });
      w.append(b);
    }
    main.append(w);
  }

  /* ---------- Layer 2: compare ---------- */
  const cmp = el('section', { attrs: { 'aria-labelledby': 'cmp-h' } },
    el('h2', { cls: 'big', text: 'How the options compare', attrs: { id: 'cmp-h' } }),
    el('p', { cls: 'lede', text: 'Each option scored 1 to 5 per criterion by a neutral analyst. Select a score to see why.' }));
  const table = el('table', { cls: 'matrix' });
  const recCls = id => id === recId ? 'is-rec' : '';
  table.append(el('thead', {}, el('tr', {},
    el('th', { cls: 'crit', text: 'Criterion', attrs: { scope: 'col' } }),
    options.map(o => el('th', { cls: recCls(o.id), attrs: { scope: 'col', title: o.description || '' } }, o.name, o.id === recId ? el('span', { cls: 'rec', text: 'Chosen' }) : null)))));
  const tbody = el('tbody');
  const reason = el('div', { cls: 'reason', attrs: { 'aria-live': 'polite' } }, el('span', { cls: 'muted', text: 'Select any score to read the reason behind it.' }));
  const weightLabels = {};
  let pressed = null;
  for (const c of criteria) {
    const wl = el('span', { cls: 'w' }); weightLabels[c.id] = wl;
    tbody.append(el('tr', {},
      el('th', { cls: 'crit', attrs: { scope: 'row' } }, c.name, wl),
      options.map(o => {
        const sc = cell(o.id, c.id); const n = sc.score || 0;
        const btn = el('button', { cls: 'cellbtn', attrs: { type: 'button', 'aria-pressed': 'false', 'aria-label': `${o.name}, ${c.name}: ${n} of 5. Show reason.` } },
          el('span', { cls: 'pips', attrs: { 'aria-hidden': 'true' } }, [1, 2, 3, 4, 5].map(i => el('i', { cls: i <= n ? 'on' : '' }))),
          el('span', { cls: 'num', text: n }));
        btn.addEventListener('click', () => {
          if (pressed) pressed.setAttribute('aria-pressed', 'false');
          pressed = btn; btn.setAttribute('aria-pressed', 'true');
          reason.replaceChildren(el('b', { text: `${o.name}, ${c.name}: ${n} of 5. ` }), String(sc.rationale || 'No reason recorded.').replace(/^Supervisor:\s*/, ''));
        });
        return el('td', { cls: recCls(o.id) }, btn);
      })));
  }
  table.append(tbody);
  const totalCells = {};
  table.append(el('tfoot', {}, el('tr', {},
    el('th', { cls: 'crit', text: 'Overall, out of 5', attrs: { scope: 'row' } }),
    options.map(o => { const t = el('span', { cls: 'total' }); totalCells[o.id] = t; return el('td', { cls: recCls(o.id) }, t); }))));

  // Priorities: sliders that re-weight the totals live.
  const sliders = el('div', { cls: 'sliders' });
  const inputs = {}; const outs = {};
  for (const c of criteria) {
    const out = el('span'); outs[c.id] = out;
    const inp = el('input', { attrs: { type: 'range', min: '0', max: '100', step: '1', id: 'w-' + c.id } });
    inputs[c.id] = inp;
    inp.addEventListener('input', () => {
      // Move this criterion, rescale the others so the shares still add to 100%.
      const v = Number(inp.value) / 100; const rest = Object.keys(weights).filter(k => k !== c.id);
      const restSum = rest.reduce((s, k) => s + weights[k], 0);
      weights[c.id] = v;
      for (const k of rest) weights[k] = restSum > 0 ? weights[k] / restSum * (1 - v) : (1 - v) / rest.length;
      draw();
    });
    sliders.append(el('div', { cls: 'slider' }, el('label', { attrs: { for: 'w-' + c.id } }, c.name, out), inp));
  }
  const prioNote = el('span');
  const reset = el('button', { cls: 'reset', text: 'Reset', attrs: { type: 'button' } });
  reset.addEventListener('click', () => { Object.assign(weights, initial); draw(); });
  const prio = el('details', { cls: 'prio' }, el('summary', { text: 'Try your own priorities' }), sliders, el('div', { cls: 'prio-foot' }, prioNote, reset));

  function draw() {
    const t = totalsFor(weights); const win = winnersOf(t);
    for (const c of criteria) { weightLabels[c.id].textContent = 'counts ' + pct(weights[c.id]); outs[c.id].textContent = pct(weights[c.id]); inputs[c.id].value = Math.round(weights[c.id] * 100); }
    for (const o of options) { totalCells[o.id].className = 'total' + (win.includes(o.id) ? ' lead' : ''); totalCells[o.id].textContent = t[o.id].toFixed(2); }
    const changed = Object.keys(weights).some(k => Math.abs(weights[k] - initial[k]) > 0.005);
    prioNote.textContent = !changed ? 'These are the priorities the assessment used.'
      : win.length > 1 ? `With these priorities, ${joinAnd(win.map(w => names[w]))} tie.`
      : win[0] === recId ? `${names[win[0]]} still leads with these priorities.`
      : `With these priorities, ${names[win[0]]} would lead instead.`;
  }
  draw();
  cmp.append(el('div', { cls: 'matrix-wrap' }, table, reason, prio));

  // For and against, one option at a time, biggest points first.
  const ledger = (R.ledger || []).map(i => ({ ...i, weight: (i.severity || 0) * (i.likelihood || 0) }));
  const IMPACT = { 1: 'Tiny impact', 2: 'Small impact', 3: 'Moderate impact', 4: 'Big impact', 5: 'Major impact' };
  const LIKELY = { 1: 'unlikely', 2: 'possible', 3: 'fairly likely', 4: 'likely', 5: 'very likely' };
  const item = i => {
    const meta = `${IMPACT[i.severity] || ''}, ${LIKELY[i.likelihood] || ''}. Raised by ${joinAnd(list(i.raised_by).map(roleName))}.`;
    const head = el('span', { text: i.point || i.claim });
    return el('li', {}, el('details', { cls: 'item' }, el('summary', {}, head),
      el('div', { cls: 'item-body' }, i.point ? el('p', { text: i.claim }) : null, el('p', { cls: 'item-meta', text: meta }))));
  };
  const SHOW_N = 3;
  const column = (o, kind) => {
    const rows = ledger.filter(i => i.option === o && i.kind === kind).sort((a, b) => b.weight - a.weight);
    const ol = el('ol'); rows.slice(0, SHOW_N).forEach(i => ol.append(item(i)));
    const wrap = el('div', {}, el('h3', { cls: kind === 'pro' ? 'for' : 'against', text: kind === 'pro' ? 'For' : 'Against' }), ol);
    if (!rows.length) ol.append(el('li', { cls: 'muted', text: 'Nothing raised.' }));
    if (rows.length > SHOW_N) { const b = el('button', { cls: 'linkbtn', text: `Show ${rows.length - SHOW_N} more`, attrs: { type: 'button' } }); b.addEventListener('click', () => { rows.slice(SHOW_N).forEach(i => ol.append(item(i))); b.remove(); }); wrap.append(b); }
    return wrap;
  };
  const tabs = el('div', { cls: 'tabs', attrs: { role: 'tablist', 'aria-label': 'Points for and against each option' } });
  const panel = el('div', { cls: 'fa', attrs: { role: 'tabpanel' } });
  const order = recId ? [recId, ...options.map(o => o.id).filter(i => i !== recId)] : options.map(o => o.id);
  const tabBtns = order.map(id => {
    const b = el('button', { cls: 'tab', text: names[id], attrs: { type: 'button', role: 'tab', 'aria-selected': 'false', id: 'tab-' + id } });
    b.addEventListener('click', () => show(id)); return b;
  });
  tabs.append(...tabBtns);
  tabs.addEventListener('keydown', e => {
    const i = tabBtns.indexOf(document.activeElement); if (i < 0) return;
    const j = e.key === 'ArrowRight' ? (i + 1) % tabBtns.length : e.key === 'ArrowLeft' ? (i - 1 + tabBtns.length) % tabBtns.length : -1;
    if (j >= 0) { e.preventDefault(); tabBtns[j].focus(); tabBtns[j].click(); }
  });
  function show(id) {
    tabBtns.forEach(b => { const on = b.id === 'tab-' + id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
    panel.setAttribute('aria-labelledby', 'tab-' + id);
    panel.replaceChildren(column(id, 'pro'), column(id, 'con'));
  }
  if (order.length) show(order[0]);
  cmp.append(tabs, panel);
  main.append(cmp);

  /* ---------- Layer 3: how this was decided ---------- */
  const how = el('section', { attrs: { 'aria-labelledby': 'how-h' } },
    el('h2', { cls: 'big', text: 'How this was decided', attrs: { id: 'how-h' } }),
    el('p', { cls: 'lede', text: `${reports.length} council members each argued one angle, without seeing the others. A neutral analyst scored the options, and the lead reviewer weighed it all.` }));
  if (reports.length) {
    how.append(el('div', { cls: 'agree', attrs: { role: 'img', 'aria-label': recId ? `${backers.length} of ${reports.length} members chose ${names[recId]}` : '' } },
      reports.map(r => el('span', { cls: pickOf(r) === recId ? 'yes' : '' }))));
    const council = el('div', { cls: 'council' });
    for (const r of reports) {
      const p = pickOf(r);
      const reasoning = list(r.reasoning);
      const bodyEl = el('div', { cls: 'm-body' },
        r.point ? el('p', { text: r.position }) : null,
        reasoning.length ? [el('h4', { text: 'Reasoning' }), el('ul', {}, reasoning.map(x => /^Flip:/i.test(x)
          ? el('li', { cls: 'flip' }, el('strong', { text: 'What would change this view: ' }), x.replace(/^Flip:\s*/i, ''))
          : el('li', { text: x })))] : null,
        r.surprise ? [el('h4', { text: 'A point others may miss' }), el('p', { text: r.surprise })] : null,
        list(r.evidence).length ? [el('h4', { text: 'Evidence' }), el('ul', {}, list(r.evidence).map(x => el('li', {}, linkify(x))))] : null);
      council.append(el('details', { cls: 'member' },
        el('summary', {},
          el('span', { cls: 'm-name', text: roleName(r.role) }),
          el('span', { cls: 'm-pick' + (p === recId ? ' yes' : ''), text: p ? 'Chose ' + names[p] : 'No clear pick' }),
          el('span', { cls: 'm-point', text: r.point || r.position })),
        bodyEl));
    }
    how.append(council);
  }

  const more = el('div', { cls: 'more-sec' });
  const pre = R.precommit || {};
  const drift = String(R.drift || '');
  const unchanged = /^no change|^none/i.test(drift.trim());
  if (pre.position || drift) more.append(el('details', {},
    el('summary', {}, 'Did the council change the lead reviewer’s mind?', el('span', { cls: 'sum-note', text: unchanged ? 'No' : 'Yes' })),
    el('div', { cls: 'bg' },
      el('p', { text: drift }),
      pre.position ? [el('h4', { text: 'View written down before the council' }), el('p', { text: pre.position }),
        list(pre.reasons).length ? el('ul', {}, list(pre.reasons).map(x => el('li', { text: x }))) : null,
        pre.main_risk ? el('p', { text: 'Main risk seen then: ' + pre.main_risk }) : null] : null)));

  const research = { online: 'Researched online', repo: 'Researched in the code', both: 'Researched online and in the code', none: 'No outside research' }[brief.research] || '';
  more.append(el('details', {},
    el('summary', {}, 'Background and sources', el('span', { cls: 'sum-note', text: research })),
    el('div', { cls: 'bg' },
      brief.context ? [el('h4', { text: 'Situation' }), el('p', { text: brief.context })] : null,
      brief.stakes ? [el('h4', { text: 'What is at stake' }), el('p', { text: brief.stakes })] : null,
      list(brief.constraints).length ? [el('h4', { text: 'Constraints' }), el('ul', {}, list(brief.constraints).map(x => el('li', { text: x })))] : null,
      options.length ? [el('h4', { text: 'Options' }), el('ul', {}, options.map(o => el('li', {}, el('strong', { text: o.name + '. ' }), o.description || '')))] : null,
      criteria.length ? [el('h4', { text: 'Why each criterion counts' }), el('ul', {}, criteria.map(c => el('li', {}, el('strong', { text: `${c.name} (${pct(initial[c.id])}). ` }), c.why || '')))] : null,
      (brief.evidence || []).length ? [el('h4', { text: 'Facts gathered' }), el('ul', {}, brief.evidence.map(e => el('li', {}, String(e.claim || '') + ' Source: ', linkify(e.source))))] : null)));
  how.append(more);
  main.append(how);

  main.append(el('footer', { text: 'Made with the critically-assess skill.' }));
})();
</script>
</body>
</html>
